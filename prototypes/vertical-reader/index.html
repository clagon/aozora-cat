<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<title>縦書きページ送りの検証ハーネス</title>
		<link rel="stylesheet" href="/tokens.css" />
		<link rel="stylesheet" href="/reader.css" />
	</head>
	<body>
		<div id="viewport" tabindex="0" role="region" aria-label="本文">
			<div id="chrome" hidden>
				<span id="status"></span>
				<!-- 実機で再読み込みせずに条件を切り替え、同じ位置で往復できるか確かめるための操作。 -->
				<div role="group" aria-label="書字方向">
					<button type="button" data-mode="vertical">縦書き</button>
					<button type="button" data-mode="horizontal">横書き</button>
				</div>
				<div role="group" aria-label="文字サイズ">
					<button type="button" data-size="16">16</button>
					<button type="button" data-size="18">18</button>
					<button type="button" data-size="20">20</button>
					<button type="button" data-size="24">24</button>
				</div>
				<div role="group" aria-label="テーマ">
					<button type="button" data-theme="white">白</button>
					<button type="button" data-theme="paper">紙</button>
					<button type="button" data-theme="night">夜間</button>
				</div>
			</div>
		</div>
		<script type="module" src="/harness.js"></script>
	</body>
</html>
